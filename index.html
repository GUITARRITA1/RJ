<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Sesión Expirada | Gracias por confiar</title>
    <style>
        /* Reset básico para eliminar márgenes y padding por defecto */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Fondo turquesa sólido y vibrante */
            background-color: #20B2AA;  /* LightSeaGreen, un tono turquesa elegante */
            /* Fallback con gradiente sutil para dar profundidad (opcional, mantiene el turquesa) */
            background: linear-gradient(135deg, #20B2AA 0%, #48D1CC 100%);
            
            /* Asegurar que el body ocupe toda la altura de la ventana */
            min-height: 100vh;
            
            /* Usar flexbox para centrar perfectamente los elementos */
            display: flex;
            align-items: center;
            justify-content: center;
            
            /* Fuente limpia y moderna, con fallbacks para todos los sistemas */
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', system-ui, -apple-system, sans-serif;
            
            /* Suavizado de texto para mejor legibilidad */
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }

        /* Contenedor principal que agrupa los dos mensajes */
        .message-container {
            text-align: center;
            max-width: 90vw;        /* Para que en móviles no se desborde */
            width: 100%;
            padding: 1.5rem;
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
        }

        /* Estilo para el mensaje pequeño: SESION NETWORK EXPIRED */
        .expired-message {
            font-size: 1.2rem;
            letter-spacing: 1px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.92);
            background: rgba(0, 0, 0, 0.15);
            display: inline-block;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            backdrop-filter: blur(2px);
            margin-bottom: 2rem;
            text-transform: uppercase;
            font-family: monospace, 'Courier New', 'SF Mono', 'Segoe UI', monospace;
            border: 1px solid rgba(255,255,255,0.25);
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        /* Mensaje grande y expandido: "Gracias por confiar en nosotros!" */
        .thanks-message {
            font-size: clamp(2.2rem, 10vw, 4.2rem);
            font-weight: 800;
            color: white;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            line-height: 1.2;
            margin-top: 0.5rem;
            word-break: break-word;
            background: linear-gradient(135deg, #FFFFFF 0%, #F0F8FF 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: none;
            /* Para darle un efecto más moderno y legible, usamos un color blanco sólido con ligera sombra */
            /* Pero el gradiente en texto es sutil y elegante, combinamos con un respaldo */
        }
        
        /* Versión sólida y más legible sobre el fondo turquesa: 
           realmente el blanco puro con sombra se ve muy bien. 
           Prefiero un blanco sólido para máxima claridad y un efecto sutil de relieve */
        .thanks-message {
            color: #FFFFFF;
            background: none;
            -webkit-background-clip: unset;
            background-clip: unset;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
        }
        
        /* Añadir un pequeño subtítulo o efecto decorativo opcional (línea decorativa) */
        .thanks-message::after {
            content: '';
            display: block;
            width: 80px;
            height: 3px;
            background: rgba(255, 255, 255, 0.5);
            margin: 1.2rem auto 0;
            border-radius: 4px;
        }
        
        /* Animación de entrada sutil */
        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Para pantallas muy pequeñas, ajustar márgenes y espaciado */
        @media (max-width: 480px) {
            .expired-message {
                font-size: 0.9rem;
                padding: 0.4rem 1rem;
                margin-bottom: 1.5rem;
            }
            .thanks-message {
                line-height: 1.3;
                letter-spacing: -0.01em;
            }
            .thanks-message::after {
                width: 60px;
                margin-top: 1rem;
            }
            .message-container {
                padding: 1rem;
            }
        }
        
        /* Mejora de accesibilidad: foco y hover opcional (para mantener consistencia) */
        .message-container:focus-visible {
            outline: 2px solid white;
            outline-offset: 4px;
            border-radius: 20px;
        }
        
        /* Si se desea un efecto de leve brillo en el fondo, se puede agregar un pseudo-elemento opcional,
           pero no es necesario para cumplir los requisitos. Solo para dar un toque premium */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 40%, rgba(255,255,255,0.08) 0%, rgba(0,0,0,0.02) 100%);
            pointer-events: none;
            z-index: 0;
        }
        
        /* Asegurar que el contenedor esté por encima del pseudo-elemento */
        .message-container {
            position: relative;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div class="message-container" role="main" aria-labelledby="expired-text thanks-text">
        <!-- Mensaje pequeño: SESION NETWORK EXPIRED -->
        <div class="expired-message" id="expired-text">
            SESION NETWORK EXPIRED
            <br>ELINGELOWCOST
        </div>
        
        <!-- Mensaje grande y expandido (ocupa ancho y tiene tamaño destacado) -->
        <div class="thanks-message" id="thanks-text">
            Gracias por confiar<br> en nosotros!
           <br> Sistemas de Ingeniería COliver Atom
            <!-- El <br> permite un salto elegante en pantallas pequeñas, pero mantiene la expansión -->
        </div>
    </div>
</body>
</html>

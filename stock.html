<h2 style="text-align:center;">Stock Actual</h2>

<table id="tabla">
<tr>
  <th>Código</th>
  <th>Material</th>
  <th>Dimensional</th>
  <th>Stock</th>
</tr>
</table>

<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  document.addEventListener("DOMContentLoaded", async () => {

    const SUPABASE_URL = "https://vlvfbckdqemjghphefnx.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZsdmZiY2tkcWVtamdocGhlZm54Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTkzNDAsImV4cCI6MjA4ODc3NTM0MH0.DnxTRvkoH2mc0rQBc_M29e2dMGS610MDHcMMtOKHIVM"; // reemplaza con tu anon key

    // Instancia del cliente Supabase
    const supabaseStock = Supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function cargarStock() {
      const tabla = document.getElementById("tabla");

      try {
            // Traer todos los datos de la vista stock_actual_mv
            const { data, error } = await supabase
                .from("stock_actual_mv")
                .select("*")
                .order("codigo");

            if(error){
                console.error("Error cargando stock_actual_mv:", error);
                return;
            }
 // Limpiar tabla excepto encabezado
            tabla.querySelectorAll("tr:not(:first-child)").forEach(e => e.remove());
 // Mostrar cada fila
            data.forEach(row => {
                const fila = document.createElement("tr");
                fila.innerHTML = `
                    <td>${row.codigo}</td>
                    <td>${row.material}</td>
                    <td>${row.dimensional || ""}</td>
                    <td>${row.stock}</td>
                `;
                tabla.appendChild(fila);
            });

        } catch(err) {
            console.error("Fetch falló:", err);
        }
    }

    cargarStock();
});
</script>

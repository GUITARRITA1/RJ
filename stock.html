<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Stock</title>
<style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h2 { text-align: center; }
    table { width: 80%; margin: auto; border-collapse: collapse; }
    th, td { padding: 8px 12px; text-align: center; }
    th { background-color: #f2f2f2; }
</style>
</head>
<body>

<h2>Stock Actual</h2>

<table border="1" id="tabla">
<tr>
<th>Código</th>
<th>Material</th>
<th>Dimensional</th>
<th>Stock</th>
</tr>
</table>

<script>
let movimientos = JSON.parse(localStorage.getItem("movimientos")) || [];
let materiales = JSON.parse(localStorage.getItem("materiales")) || [];

let stock = {};

// Inicializamos stock de todos los materiales a 0
materiales.forEach(mat => {
    stock[mat.codigo] = 0;
});

// Aplicamos movimientos
movimientos.forEach(m => {
    if(m.tipo === "entrada") stock[m.codigo] += m.cantidad;
    else stock[m.codigo] -= m.cantidad;
});

// Mostramos tabla
const tabla = document.getElementById("tabla");
materiales.forEach(mat => {
    let fila = document.createElement("tr");
    fila.innerHTML = `
        <td>${mat.codigo}</td>
        <td>${mat.material}</td>
        <td>${mat.dimensional}</td>
        <td>${stock[mat.codigo]}</td>
    `;
    tabla.appendChild(fila);
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Stock Actual</title>
<style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table { border-collapse: collapse; width: 80%; margin: auto; }
    th, td { border: 1px solid #333; padding: 8px; text-align: center; }
    th { background-color: #f2f2f2; }
</style>
</head>
<body>

<h2 style="text-align:center;">Stock Actual</h2>

<table id="tabla">
<tr>
  <th>Código</th>
  <th>Material</th>
  <th>Dimensional</th>
  <th>Stock</th>
</tr>
</table>

<!-- Librería Supabase local -->
<script src="js/supabase.js"></script>

<script>
  // Inicializar Supabase (instancia separada)
  const SUPABASE_URL = "https://vlvfbckdqemjghphefnx.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZsdmZiY2tkcWVtamdocGhlZm54Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTkzNDAsImV4cCI6MjA4ODc3NTM0MH0.DnxTRvkoH2mc0rQBc_M29e2dMGS610MDHcMMtOKHIVM";

  const supabaseStock = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: false }
  });

  // Cargar stock actual
  async function cargarStock() {
      const tabla = document.getElementById("tabla");

      try {
          // Traer movimientos
          const { data: movimientos, error: errMov } = await supabaseStock
              .from("movimientos")
              .select("*");

          if (errMov) {
              console.error("Error cargando movimientos:", errMov);
              return;
          }

          // Traer lista de materiales (materialList creada por admin)
          const materialesLocal = JSON.parse(localStorage.getItem("materiales")) || [];

          // Calcular stock por código
          let stock = {};

          movimientos.forEach(m => {
              if (!stock[m.codigo]) stock[m.codigo] = 0;
              if (m.tipo === "entrada") stock[m.codigo] += m.cantidad;
              else stock[m.codigo] -= m.cantidad;
          });

          // Limpiar tabla excepto encabezado
          tabla.querySelectorAll("tr:not(:first-child)").forEach(e => e.remove());

          // Mostrar cada material
          Object.keys(stock).forEach(codigo => {
              let mat = materialesLocal.find(x => x.codigo == codigo);

              const fila = document.createElement("tr");
              fila.innerHTML = `
                  <td>${codigo}</td>
                  <td>${mat ? mat.material : "Material desconocido"}</td>
                  <td>${mat ? mat.dimensional : ""}</td>
                  <td>${stock[codigo]}</td>
              `;
              tabla.appendChild(fila);
          });

      } catch (err) {
          console.error("Fetch falló:", err);
      }
  }

  // Ejecutar al cargar
  cargarStock();
</script>

</body>
</html>

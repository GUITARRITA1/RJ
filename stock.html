<tr>
<th>Código</th>
<th>Material</th>
<th>Dimensional</th>
<th>Stock</th>
</tr>
</table>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseUrl = "https://vlvfbckdqemjghphefnx.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZsdmZiY2tkcWVtamdocGhlZm54Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTkzNDAsImV4cCI6MjA4ODc3NTM0MH0.DnxTRvkoH2mc0rQBc_M29e2dMGS610MDHcMMtOKHIVM"; // regenera tu key por seguridad

const supabase = supabase.createClient(supabaseUrl, supabaseKey);

async function cargarStock() {
    const tabla = document.getElementById("tabla");

    const { data, error } = await supabase
        .from("stock_actual")
        .select("*");

    if (error) {
        console.error("Error cargando stock:", error);
        return;
    }

    // limpiar tabla
    tabla.querySelectorAll("tr:not(:first-child)").forEach(e => e.remove());

    // mostrar datos
    data.forEach(mat => {
        const fila = document.createElement("tr");
        fila.innerHTML = `
            <td>${mat.codigo}</td>
            <td>${mat.material}</td>
            <td>${mat.dimensional}</td>
            <td>${mat.stock}</td>
        `;
        tabla.appendChild(fila);
    });
}

cargarStock();
</script>

<!DOCTYPE html>
<html>
<div style="text-align:center; margin-bottom:20px;">
  <img src="RJ.jpg" alt="REFRIGERACION JULIO" style="max-width:300px; height:auto;">
</div>

<div style="text-align:RIGHT; margin-bottom:20px;">
  <img src="INGE.jpg" alt="REFRIGERACION JULIO" style="max-width:300px; height:auto;">
</div>

<head>
<title>Stock</title>
</head>

<body>

<h2>Stock Actual</h2>

<table border="1" id="tabla">

<tr>
<th>Código</th>
<th>Material</th>
<th>Dimensional</th>
<th>Stock</th>
</tr>

</table>

<script>

let movimientos=JSON.parse(localStorage.getItem("movimientos"))||[]
let materiales=JSON.parse(localStorage.getItem("materiales"))||[]

let stock={}

movimientos.forEach(m=>{

if(!stock[m.codigo])
stock[m.codigo]=0

if(m.tipo=="entrada")
stock[m.codigo]+=m.cantidad
else
stock[m.codigo]-=m.cantidad

})

for(let codigo in stock){

let mat=materiales.find(x=>x.codigo==codigo)

let fila=document.createElement("tr")

fila.innerHTML=`
<td>${codigo}</td>
<td>${mat.material}</td>
<td>${mat.dimensional}</td>
<td>${stock[codigo]}</td>
`

tabla.appendChild(fila)

}

</script>

</body>

</html>

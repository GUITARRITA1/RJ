<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Stock Actual</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
font-family: Arial;
margin:20px;
}

table{
border-collapse: collapse;
width:80%;
margin:auto;
}

th,td{
border:1px solid #333;
padding:8px;
text-align:center;
}

th{
background:#f2f2f2;
}

h2{
text-align:center;
}
</style>

</head>

<body>

<h2>Stock Actual</h2>

<table id="tabla">

<tr>
<th>Código</th>
<th>Material</th>
<th>Stock</th>
</tr>

</table>

<script>

// conexión Supabase
const supabaseUrl = "https://vlvfbckdqemjghphefnx.supabase.co";
const supabaseKey = "TU_ANON_KEY"; 

const supabaseClient = supabase.createClient(
supabaseUrl,
supabaseKey
);


// cargar stock
async function cargarStock(){

const tabla=document.getElementById("tabla")

const { data, error } = await supabaseClient
.from("stock_actual")
.select("*")
.order("codigo",{ascending:true})

console.log("STOCK:",data)
console.log("ERROR:",error)

if(error){
console.error("Error cargando stock:",error)
return
}

// limpiar tabla
tabla.querySelectorAll("tr:not(:first-child)").forEach(e=>e.remove())

// insertar filas
data.forEach(mat=>{

let fila=document.createElement("tr")

fila.innerHTML=`
<td>${mat.codigo}</td>
<td>${mat.materiales || ""}</td>
<td>${mat.stock}</td>
`

tabla.appendChild(fila)

})

}


// ejecutar al abrir
cargarStock()

</script>

</body>

</html>

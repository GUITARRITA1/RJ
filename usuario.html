<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Movimiento de Material</title>
</head>
<body>

<div style="text-align:center; margin-bottom:20px;">
  <img src="RJ.jpg" style="max-width:300px;">
</div>

<div style="text-align:right; margin-bottom:20px;">
  <img src="INGE.jpg" style="max-width:300px;">
</div>

<h2>Entrada / Salida de Material</h2>

<!-- Formulario -->
<label>Material:</label>
<input list="materialesList" id="codigo" placeholder="Escribe para buscar material">
<datalist id="materialesList"></datalist>

<br><br>

<label>Tipo:</label>
<select id="tipo">
  <option value="entrada">Entrada</option>
  <option value="salida">Salida</option>
</select>

<br><br>

<label>Cantidad:</label>
<input type="number" id="cantidad">

<br><br>

<label>Responsable:</label>
<input id="responsable">

<br><br>

<label>Cliente / Proveedor:</label>
<input id="cliente">

<br><br>

<button onclick="guardar()">Guardar</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script>
  // Inicializar Supabase
  const { createClient } = supabase
  const supabaseClient = createClient(
    "https://vlvfbckdqemjghphefnx.supabase.co",
    "TU_ANON_KEY_AQUI"  // <-- reemplaza con tu anon key
  );

  // Cargar materiales desde localStorage (puedes adaptarlo a Supabase si quieres)
  function cargarMateriales() {
    let materiales = JSON.parse(localStorage.getItem("materiales")) || []
    let datalist = document.getElementById("materialesList")
    datalist.innerHTML = ""
    materiales.forEach(m => {
      let opcion = document.createElement("option")
      opcion.value = m.codigo + " - " + m.material + " - " + m.dimensional
      datalist.appendChild(opcion)
    })
  }

  // Guardar movimiento en Supabase
  async function guardar() {
    let input = document.getElementById("codigo").value
    let codigo = input.split(" - ")[0]

    if (!codigo) {
      alert("Selecciona un material válido")
      return
    }

    let tipo = document.getElementById("tipo").value
    let cantidad = parseInt(document.getElementById("cantidad").value)
    let responsable = document.getElementById("responsable").value
    let cliente = document.getElementById("cliente").value

    console.log({ codigo, tipo, cantidad, responsable, cliente })

    const { data, error } = await supabaseClient
      .from("movimientos")
      .insert([{
        codigo,
        tipo,
        cantidad,
        responsable,
        cliente,
        fecha: new Date().toISOString()
      }])

    console.log("DATA:", data)
    console.log("ERROR:", error)

    if (error) {
      alert("Error al guardar, revisa la consola")
    } else {
      alert("Movimiento guardado")
      // Limpiar campos
      document.getElementById("codigo").value = ""
      document.getElementById("tipo").value = "entrada"
      document.getElementById("cantidad").value = ""
      document.getElementById("responsable").value = ""
      document.getElementById("cliente").value = ""
    }
  }

  // Cargar materiales al abrir la página
  cargarMateriales()
</script>

</body>
</html>

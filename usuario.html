<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Movimiento de Material</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; }
  input, select, button { margin: 5px 0; padding: 5px; width: 200px; }
  label { display: block; margin-top: 10px; }
</style>
</head>
<body>

<div style="text-align:center; margin-bottom:20px;">
  <img src="RJ.jpg" style="max-width:300px;">
</div>

<div style="text-align:right; margin-bottom:20px;">
  <img src="INGE.jpg" style="max-width:300px;">
</div>

<h2>Entrada / Salida de Material</h2>

<!-- Formulario -->
<label>Material:</label>
<input list="materialesList" id="codigo" placeholder="Escribe para buscar material">
<datalist id="materialesList"></datalist>

<label>Tipo:</label>
<select id="tipo">
  <option value="entrada">Entrada</option>
  <option value="salida">Salida</option>
</select>

<label>Cantidad:</label>
<input type="number" id="cantidad">

<label>Responsable:</label>
<input id="responsable">

<label>Cliente / Proveedor:</label>
<input id="cliente">

<button id="guardarBtn">Guardar</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Inicializar Supabase
  const supabaseUrl = "https://vlvfbckdqemjghphefnx.supabase.co";
  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZsdmZiY2tkcWVtamdocGhlZm54Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTkzNDAsImV4cCI6MjA4ODc3NTM0MH0.DnxTRvkoH2mc0rQBc_M29e2dMGS610MDHcMMtOKHIVM"; // reemplaza con tu anon key
  const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

  // Cargar materiales en el datalist
  function cargarMateriales() {
    const materiales = JSON.parse(localStorage.getItem("materiales")) || [];
    const datalist = document.getElementById("materialesList");
    datalist.innerHTML = "";
    materiales.forEach(m => {
      const opcion = document.createElement("option");
      opcion.value = m.codigo + " - " + m.material + " - " + m.dimensional;
      datalist.appendChild(opcion);
    });
  }

  // Guardar movimiento en Supabase
  async function guardar() {
    const input = document.getElementById("codigo").value;
    const codigo = input.split(" - ")[0];

    if (!codigo) { 
      alert("Selecciona un material válido"); 
      return;
    }

    const tipo = document.getElementById("tipo").value;
    const cantidad = parseInt(document.getElementById("cantidad").value);
    const responsable = document.getElementById("responsable").value;
    const cliente = document.getElementById("cliente").value;

    console.log({ codigo, tipo, cantidad, responsable, cliente });

    const { data, error } = await supabaseClient
      .from("movimientos")
      .insert([{
        codigo,
        tipo,
        cantidad,
        responsable,
        cliente,
        fecha: new Date().toISOString()
      }]);

    console.log("DATA:", data);
    console.log("ERROR:", error);

    if (error) {
      alert("Error al guardar, revisa la consola");
    } else {
      alert("Movimiento guardado correctamente");
      // Limpiar campos
      document.getElementById("codigo").value = "";
      document.getElementById("tipo").value = "entrada";
      document.getElementById("cantidad").value = "";
      document.getElementById("responsable").value = "";
      document.getElementById("cliente").value = "";
    }
  }

  // Ejecutar al cargar
  cargarMateriales();
  document.getElementById("guardarBtn").addEventListener("click", guardar);
</script>

</body>
</html>

<script>
// ================== SUPABASE ==================
const supabaseUrl = "https://vlvfbckdqemjghphefnx.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZsdmZiY2tkcWVtamdocGhlZm54Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTkzNDAsImV4cCI6MjA4ODc3NTM0MH0.DnxTRvkoH2mc0rQBc_M29e2dMGS610MDHcMMtOKHIVM";
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

// ================== FUNCIONES ==================
function generarCodigo(rubro, sub) {
    let materiales = JSON.parse(localStorage.getItem("materiales")) || []
    let prefijo = rubro.substring(0, 2).toUpperCase() + sub.substring(0, 2).toUpperCase()
    let contador = 1
    materiales.forEach(m => {
        if (m.codigo.startsWith(prefijo)) contador++
    })
    let numero = contador.toString().padStart(6, "0")
    return prefijo + numero
}

async function agregarMaterial() {
    let material = document.getElementById("material").value
    let rubro = document.getElementById("rubro").value
    let sub = document.getElementById("sub").value
    let dimensional = document.getElementById("dimensional").value
    let descripcion = document.getElementById("descripcion").value

    if (!material || !rubro || !sub) {
        alert("Material, Rubro y Subclasificación son obligatorios")
        return
    }

    let codigo = generarCodigo(rubro, sub)

    let nuevo = {
        codigo: codigo,
        material: material,
        rubro: rubro,
        sub: sub,
        dimensional: dimensional,
        descripcion: descripcion,
    }

    let materiales = JSON.parse(localStorage.getItem("materiales")) || []
    materiales.push(nuevo)
    localStorage.setItem("materiales", JSON.stringify(materiales))

    try {
        const { data, error } = await supabaseClient
            .from("altas")
            .insert([nuevo])

        if (error) {
            console.error("Error al guardar en Supabase:", error)
            alert("Material guardado localmente, pero fallo al guardar en Supabase.")
        } else {
            console.log("Material guardado en Supabase:", data)
        }
    } catch (e) {
        console.error("Excepción al guardar en Supabase:", e)
    }

    alert("Material guardado con código: " + codigo)
    cargarMateriales() // Recargar la tabla
}

async function borrarMaterial(codigo) {
    if (!confirm("¿Eliminar este material?")) return;
    
    const { error } = await supabaseClient
        .from("altas")
        .delete()
        .eq("codigo", codigo);
    
    if (error) {
        alert("Error: " + error.message);
    } else {
        alert("Eliminado");
        cargarMateriales(); // recarga la tabla
    }
}

 
async function cargarMateriales() {
    if (!userAuthenticated) return;
    
    const { data, error } = await supabaseClient
        .from("altas")
        .select("*")
        .order("codigo")

    if (error) {
        console.log(error)
        return
    }

    let tabla = document.getElementById("tablaMateriales")
    
    // Buscar o crear el tbody
    let tbody = tabla.querySelector("tbody")
    if (!tbody) {
        tbody = document.createElement("tbody")
        tabla.appendChild(tbody)
    }
    
    // Limpiar y agregar filas
    tbody.innerHTML = ""
    data.forEach(m => {
        let fila = document.createElement("tr")
        fila.innerHTML = `
            <td>${m.codigo || ''}</td>
            <td>${m.material || ''}</td>
            <td>${m.rubro || ''}</td>
            <td>${m.sub || ''}</td>
            <td>${m.dimensional || ''}</td>
            <td>${m.descripcion || ''}</td>
            <td><button onclick="borrarMaterial('${m.codigo}')">🗑️ Borrar</button></td>

        `
        tbody.appendChild(fila)
    })

}


     
// ================== LOGIN ==================
let userAuthenticated = false;

function userLogin() {
    const username = document.getElementById('loginUser').value;
    const password = document.getElementById('loginPass').value;
    
    if (username === 'refrijul' && password === 'rj007') {
        userAuthenticated = true;
        document.getElementById('loginScreen').style.display = 'none';
        document.querySelector('.content-hidden').classList.remove('content-hidden');
        document.body.style.overflow = 'auto';
        document.body.classList.add('logged-in');
        cargarMateriales();
    } else {
        alert('❌ Usuario o contraseña incorrecta');
    }
}

function logout() {
    document.body.classList.remove('logged-in');
    document.getElementById('loginScreen').style.display = 'block';
    document.querySelector('.content-hidden').classList.add('content-hidden');
    userAuthenticated = false;
}

// Mostrar login al cargar
document.addEventListener("DOMContentLoaded", function() {
    document.getElementById('loginScreen').style.display = 'block';
    document.body.style.overflow = 'hidden';
});

// Enter para login

    if (e.key === 'Enter' && !userAuthenticated) {
        userLogin();

});

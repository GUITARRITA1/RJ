// ================== FUNCIONES PARA MATERIALES ==================
function generarCodigo(rubro, sub) {
    let materiales = JSON.parse(localStorage.getItem("materiales")) || []
    let prefijo = rubro.substring(0, 2).toUpperCase() + sub.substring(0, 2).toUpperCase()
    let contador = 1
    materiales.forEach(m => {
        if (m.codigo.startsWith(prefijo)) contador++
    })
    let numero = contador.toString().padStart(6, "0")
    return prefijo + numero
}

async function agregarMaterial() {
    let material = document.getElementById("material").value
    let rubro = document.getElementById("rubro").value
    let sub = document.getElementById("sub").value
    let dimensional = document.getElementById("dimensional").value
    let descripcion = document.getElementById("descripcion").value

    if (!material || !rubro || !sub) {
        alert("Material, Rubro y Subclasificación son obligatorios")
        return
    }

    let codigo = generarCodigo(rubro, sub)

    let nuevo = {
        codigo: codigo,
        material: material,
        rubro: rubro,
        sub: sub,
        dimensional: dimensional,
        descripcion: descripcion,
    }

    // ====== GUARDAR EN LOCALSTORAGE ======
    let materiales = JSON.parse(localStorage.getItem("materiales")) || []
    materiales.push(nuevo)
    localStorage.setItem("materiales", JSON.stringify(materiales))

    // ====== GUARDAR EN SUPABASE ======
    try {
        const { data, error } = await supabaseClient
            .from("altas")
            .insert([nuevo])

        if (error) {
            console.error("Error al guardar en Supabase:", error)
            alert("Material guardado localmente, pero fallo al guardar en Supabase. Revisa consola.")
        } else {
            console.log("Material guardado en Supabase:", data)
        }
    } catch (e) {
        console.error("Excepción al guardar en Supabase:", e)
    }

    alert("Material guardado con código: " + codigo)
    mostrarMateriales()
}

}

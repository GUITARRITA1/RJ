<!DOCTYPE html>
<html>
<head>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background-image: url('user2.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    min-height: 100vh;
  }  /* ← ESTA LLAVE FALTABA */

  /* ===== ESTILOS TURQUESA PARA LA TABLA (como en admin.html) ===== */

    width: 95%;

    border-radius: 12px;

  }

  #tablaMovimientos th {
        background: rgba(38, 166, 154, 0.8);  /* 0.8 = 80% opaco, 20% transparente */
            /* background: #26a69a;  /* TURQUESA */
    color: white;

    font-weight: bold;

  }

  #tablaMovimientos td {
    padding: 2px 8px;

  #tablaMovimientos tr:hover {

  .btn-borrar {

    color: white;
    border: none;
    padding: 3px 12px;
    border-radius: 5px;
    cursor: pointer;
  }
  .btn-borrar:hover {
    background: #ff1744;
  }
</style>
<title>Administrador - historial</title>
</head>

<body>

<!-- Logo Principal -->
<div style="text-align:left; margin-bottom:20px;">
  <img src="RJ.jpg" alt="REFRIGERACION JULIO" style="max-width:400px; height:auto;">
</div>

<div style="display: flex; justify-content: left; margin-bottom: 10px; height: 5vh;">
  <img src="INGE.jpg" alt="REFRIGERACION JULIO" style="max-width:300px; width:100%; height:60px;">
</div>

<h1 style="text-align: left;">Contacto: 1158297715</h1>

<hr>

<h2>Historial de Movimientos</h2>

<table id="tablaMovimientos">
  <thead>
    <tr>
      <th>Código</th>
      <th>Material</th>
      <th>Tipo</th>
      <th>Cantidad</th>
      <th>Responsable</th>
      <th>Cliente / Proveedor</th>
      <th>Fecha / Hora</th>
      <th>Acción</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<hr>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseUrl = "https://vlvfbckdqemjghphefnx.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZsdmZiY2tkcWVtamdocGhlZm54Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTkzNDAsImV4cCI6MjA4ODc3NTM0MH0.DnxTRvkoH2mc0rQBc_M29e2dMGS610MDHcMMtOKHIVM";
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

async function cargarHistorial() {
    const tbody = document.querySelector("#tablaMovimientos tbody");
    tbody.innerHTML = "";

    const { data, error } = await supabaseClient
        .from("movimientos")
        .select("*")
        .order("fecha", { ascending: false });

    if (error) {
        console.error("Error cargando historial:", error);
        return;
    }

    data.forEach(m => {
        let fila = document.createElement("tr");
        fila.innerHTML = `
            <td>${m.codigo}</td>
            <td>${m.material || ""}</td>
            <td>${m.tipo}</td>
            <td>${m.cantidad}</td>
            <td>${m.responsable}</td>
            <td>${m.cliente || ""}</td>
            <td>${new Date(m.fecha).toLocaleString()}</td>
            <td><button class="btn-borrar" onclick="borrarMovimiento(${m.id})">Borrar</button></td>
        `;
        tbody.appendChild(fila);
    });
}

async function borrarMovimiento(id) {
    if (!confirm("¿Desea borrar este movimiento?")) return;

    const { error } = await supabaseClient
        .from("movimientos")
        .delete()
        .eq("id", id);

    if (error) {
        alert("Error al borrar: " + error.message);
        console.error(error);
    } else {
        cargarHistorial();
    }
}

cargarHistorial();
</script>

</body>
</html>

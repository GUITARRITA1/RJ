<h2>Historial de Movimientos</h2>

<table border="1" id="tablaMovimientos">
<tr>
<th>Código</th>
<th>Material</th>
<th>Tipo</th>
<th>Cantidad</th>
<th>Responsable</th>
<th>Cliente / Proveedor</th>
<th>Fecha / Hora</th>
<th>Acción</th>
</tr>
</table>

<hr>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl = "https://vlvfbckdqemjghphefnx.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZsdmZiY2tkcWVtamdocGhlZm54Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxOTkzNDAsImV4cCI6MjA4ODc3NTM0MH0.DnxTRvkoH2mc0rQBc_M29e2dMGS610MDHcMMtOKHIVM";
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

async function cargarHistorial() {

    const tabla = document.getElementById("tablaMovimientos")

    tabla.innerHTML = `
    <tr>
        <th>Código</th>
        <th>Material</th>
        <th>Tipo</th>
        <th>Cantidad</th>
        <th>Responsable</th>
        <th>Cliente / Proveedor</th>
        <th>Fecha / Hora</th>
        <th>Acción</th>
    </tr>
    `

    const { data, error } = await supabaseClient
        .from("movimientos")
        .select("*")
        .order("fecha", { ascending: false })

    if (error) {
        console.error("Error cargando historial:", error)
        return
    }

    data.forEach(m => {

        let fila = document.createElement("tr")

        fila.innerHTML = `
        <td>${m.codigo}</td>
        <td>${m.materiales || ""}</td>
        <td>${m.tipo}</td>
        <td>${m.cantidad}</td>
        <td>${m.responsable}</td>
        <td>${m.cliente || ""}</td>
        <td>${new Date(m.fecha).toLocaleString()}</td>
        <td><button onclick="borrarMovimiento(${m.id})">Borrar</button></td>
        `

        tabla.appendChild(fila)

    })

}

async function borrarMovimiento(id) {

    if (!confirm("¿Desea borrar este movimiento?")) return

    const { error } = await supabaseClient
        .from("movimientos")
        .delete()
        .eq("id", id)

    if (error) {
        alert("Error al borrar")
        console.error(error)
    } else {
        cargarHistorial()
    }

}

cargarHistorial()

</script>
